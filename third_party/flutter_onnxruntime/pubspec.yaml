name: flutter_onnxruntime
description: "A lightweight plugin that provides native wrappers for running ONNX Runtime on multiple platforms"
version: 1.9.0
homepage: https://github.com/masicai/flutter_onnxruntime
repository: https://github.com/masicai/flutter_onnxruntime

environment:
  sdk: ^3.7.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
   sdk: flutter
  # The API without Flutter (sessions, values, platform interface); see
  # ANPASSUNGEN.md.
  onnxruntime_api:
    path: ../onnxruntime_api
  plugin_platform_interface: ^2.0.2
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.masicai.flutteronnxruntime
        pluginClass: FlutterOnnxruntimePlugin
        dartPluginClass: MethodChannelFlutterOnnxruntime
      ios:
        pluginClass: FlutterOnnxruntimePlugin
        dartPluginClass: MethodChannelFlutterOnnxruntime
      linux:
        pluginClass: FlutterOnnxruntimePlugin
        dartPluginClass: MethodChannelFlutterOnnxruntime
      macos:
        pluginClass: FlutterOnnxruntimePlugin
        dartPluginClass: MethodChannelFlutterOnnxruntime
      web:
        pluginClass: FlutterOnnxruntimeWebPlugin
        fileName: web/flutter_onnxruntime_web_plugin.dart
      windows:
        pluginClass: FlutterOnnxruntimePlugin
        dartPluginClass: MethodChannelFlutterOnnxruntime

topics:
 - onnx
 - onnxruntime
 - machine-learning
 - deep-learning
 - model-inference
