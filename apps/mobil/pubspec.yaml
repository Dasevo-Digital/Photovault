name: photo_vault_mobil
description: >-
  Photo Vault für das Telefon: die Bibliothek eines Photo Vault Servers –
  Zeitleiste, Betrachter, Suche, Alben, Personen, Karte, Teilen
  (Issue #86, Stufe 3).
publish_to: none
version: 0.6.3+25

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Datenbank, Abgleich und Anmeldung – derselbe Kern wie Desktop und
  # Server.
  kern:
    path: ../../packages/kern
  zierbild:
    path: ../../packages/zierbild
  # Die Landschaft unter einer Spur und der Flug darüber – wie am Rechner.
  gelaende:
    path: ../../packages/gelaende
  drift: ^2.20.0
  flutter_map: ^8.3.1
  http: ^1.6.0
  intl: ^0.20.2
  latlong2: ^0.10.1
  path: ^1.9.0
  path_provider: ^2.1.4
  photo_view: ^0.15.0
  share_plus: ^13.3.1
  # Der Code fürs Einrichten der Zwei-Faktor-Anmeldung geht an die
  # Authenticator-App auf demselben Telefon (otpauth://).
  url_launcher: ^6.3.0
  # Videos laufen vom Server, mit Teilabruf – ohne sie erst ganz zu laden.
  video_player: ^2.9.0
  photo_manager: ^3.12.0
  photo_manager_image_provider: ^2.2.0
  uuid: ^4.5.1
  package_info_plus: ^10.2.2
  workmanager: ^0.10.10
  crypto: ^3.0.5
  sqlite3: ^3.5.1
  connectivity_plus: ^7.3.1
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Testbilder für den Server im Test.
  image: ^4.2.0

flutter:
  uses-material-design: true
  generate: true

  # Vorlagenbilder und Schriften des Lebensbaums – dieselben Dateien wie
  # am Rechner (Verweise auf assets/ im Wurzelverzeichnis), damit die Bilder
  # gleich aussehen.
  assets:
    - assets/lebensbaum/
    - assets/fonts/OFL-EBGaramond.txt
    - assets/fonts/OFL-GreatVibes.txt
  # Die Entwickeln-Shader des Rechners (Verweis auf shaders/ im
  # Wurzelverzeichnis) – dieselbe Rechnung wie unter Linux und Windows.
  shaders:
    - shaders/develop_adjustments.frag
    - shaders/develop_maske.frag
    - shaders/develop_nachbarn.frag
    - shaders/develop_weich.frag
  fonts:
    - family: Zierschrift
      fonts:
        - asset: assets/fonts/EBGaramond-Variable.ttf
    - family: Zierschrift Gross
      fonts:
        - asset: assets/fonts/GreatVibes-Regular.ttf
