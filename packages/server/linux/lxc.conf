# Ergänzung für einen LXC-Container (etwa unter Proxmox). Einrichten: siehe
# README.md im Bündel, „Einzeldatei mit systemd“:
#
#   /etc/systemd/system/photo-vault-server.service.d/lxc.conf
#
# Im Container überdeckt lxcfs Teile von /proc; vollständig sichtbar ist es
# nur unter /dev/.lxc/proc. PrivateDevices=yes ersetzt /dev und blendet es
# damit aus – dann verweigert der Kernel bubblewrap für die Gastprüfung ein
# eigenes /proc, und der Server weist Beiträge von Gästen ab.
#
# Den Render-Knoten der Grafik verbirgt InaccessiblePaths trotzdem. Mit
# intel-grafik.conf ist diese Datei unnötig und stört: Die schaltet
# PrivateDevices schon ab, hier würde die Grafik wieder verborgen.

[Service]
PrivateDevices=no
InaccessiblePaths=-/dev/dri
