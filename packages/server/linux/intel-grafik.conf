# Ergänzung für Intel-Grafik (OpenVINO) unter systemd. Einrichten: siehe
# README.md im Bündel, „Intel-Grafik mit systemd“:
#
#   /etc/systemd/system/photo-vault-server.service.d/intel-grafik.conf
#
# Die Einheit verbirgt mit PrivateDevices=yes alle Geräte – auch die
# Grafik. Hier sieht der Server nur ihren Render-Knoten.

[Service]
PrivateDevices=no
DevicePolicy=closed
DeviceAllow=/dev/dri/renderD128 rw
SupplementaryGroups=render
