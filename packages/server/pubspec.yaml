name: photo_vault_server
description: >-
  Der Server zu Photo Vault: eine Bibliothek ohne Oberfläche, die Uploads
  annimmt, auswertet und an Desktop und Handy ausliefert (Issue #86).
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  crypto: ^3.0.5
  # Argon2id und AES-GCM in reinem Dart – dieselbe Fassung wie in der App.
  cryptography: ^2.7.0
  drift: ^2.20.0
  ffi: ^2.1.3
  kern:
    path: ../kern
  onnxruntime_api:
    path: ../../third_party/onnxruntime_api
  path: ^1.9.0
  # Der QR-Code fürs TOTP-Einrichten im Terminal.
  qr: ^3.0.2
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  # Die Serverdatenbank (Konten, Geräte) ohne drift: wenige Tabellen,
  # einfache Abfragen, kein Codegenerator.
  sqlite3: ^3.5.1
  uuid: ^4.5.1

dev_dependencies:
  http: ^1.6.0
  image: ^4.2.0
  lints: ^6.0.0
  test: ^1.25.0

executables:
  photo-vault-server: photo_vault_server
