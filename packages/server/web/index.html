<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Photo Vault</title>
<link rel="stylesheet" href="app.css">
<link rel="icon" href="symbol.png" type="image/png">
</head>
<body>
<header id="kopf" hidden>
  <h1>Photo Vault</h1>
  <nav id="nav">
    <a href="#/" data-bereich="fotos">Fotos</a>
    <a href="#/suche" data-bereich="suche">Suche</a>
    <a href="#/alben" data-bereich="alben">Alben</a>
    <a href="#/personen" data-bereich="personen">Personen</a>
    <a href="#/papierkorb" data-bereich="papierkorb">Papierkorb</a>
    <a href="#/konto" data-bereich="konto">Konto</a>
  </nav>
  <button id="auswaehlen" type="button" title="Mehrere auswählen">Auswählen</button>
</header>

<main id="anmeldung" class="karte" hidden>
  <h1>Photo Vault</h1>
  <form id="form-anmelden" autocomplete="on">
    <label>Konto <input name="name" autocomplete="username" required autofocus></label>
    <label>Passwort <input name="passwort" type="password" autocomplete="current-password" required></label>
    <button type="submit">Anmelden</button>
  </form>
  <form id="form-totp" hidden>
    <p id="totp-hinweis"></p>
    <p id="totp-einrichten" hidden>Richte den Code in deiner Authenticator-App ein:
      <code id="totp-geheimnis"></code> <a id="totp-link" href="#">In der App öffnen</a></p>
    <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]*" required></label>
    <button type="submit">Bestätigen</button>
  </form>
  <p id="fehler" class="fehler" role="alert"></p>
  <p id="anmeldung-fassung" class="leise klein"></p>
</main>

<main id="inhalt" hidden>
  <section id="bereich-suche" hidden>
    <form id="form-suche" class="zeile">
      <input name="text" type="search" placeholder="Wonach suchst du?" autocomplete="off" required>
      <label><input type="radio" name="art" value="inhalt" checked> Bildinhalt</label>
      <label><input type="radio" name="art" value="text"> Text</label>
      <button type="submit">Suchen</button>
    </form>
    <p id="suche-hinweis" class="leise"></p>
  </section>
  <section id="bereich-karten" hidden>
    <h2 id="karten-titel"></h2>
    <div id="karten"></div>
  </section>
  <section id="bereich-konto" hidden>
    <h2>Konto</h2>
    <p id="konto-wer"></p>
    <p id="konto-fassung" class="leise"></p>
    <div id="verwaltung" hidden>
      <h3>Server</h3>
      <ul id="server-stand"></ul>
      <p><button id="auswertung-anstossen" type="button">Auswertung anstossen</button>
         <button id="sicherung-jetzt" type="button">Jetzt sichern</button></p>
      <h3>Konten</h3>
      <ul id="konten"></ul>
      <form id="form-konto-neu" class="zeile">
        <input name="name" placeholder="Neues Konto" autocomplete="off" required>
        <input name="passwort" type="password" placeholder="Passwort (mind. 12 Zeichen)" autocomplete="new-password" minlength="12" required>
        <label><input type="checkbox" name="verwalter"> Verwalter</label>
        <button type="submit">Anlegen</button>
      </form>
    </div>
    <h3>Geräte</h3>
    <ul id="geraete"></ul>
    <h3>Passwort ändern</h3>
    <form id="form-passwort" class="karte schmal">
      <label>Aktuelles Passwort <input name="alt" type="password" autocomplete="current-password" required></label>
      <label>Neues Passwort <input name="neu" type="password" autocomplete="new-password" minlength="12" required></label>
      <label>Noch einmal <input name="neu2" type="password" autocomplete="new-password" required></label>
      <label id="passwort-code-feld" hidden>TOTP-Code <input name="code" inputmode="numeric" autocomplete="one-time-code"></label>
      <label class="zeile"><input type="checkbox" name="andere"> Andere Geräte abmelden</label>
      <button type="submit">Ändern</button>
      <p id="passwort-meldung" class="leise"></p>
    </form>
    <button id="abmelden" type="button">Abmelden</button>
  </section>
  <section id="bereich-raster" hidden>
    <div id="erinnerungen" hidden><h2>Erinnerungen</h2><div id="erinnerungen-karten"></div></div>
    <h2 id="raster-titel" hidden></h2>
    <div id="raster"></div>
    <p id="ende" class="leise"></p>
  </section>
</main>

<div id="auswahlleiste" hidden>
  <button id="auswahl-zu" type="button" aria-label="Auswahl aufheben">×</button>
  <span id="auswahl-anzahl"></span>
  <button id="auswahl-favorit" type="button">♥ Favorit</button>
  <button id="auswahl-album" type="button">Album</button>
  <button id="auswahl-laden" type="button">Herunterladen</button>
  <button id="auswahl-papierkorb" type="button">Papierkorb</button>
  <button id="auswahl-zurueck" type="button" hidden>Zurückholen</button>
</div>

<dialog id="album-dialog">
  <form method="dialog" id="form-album">
    <h3>Zum Album hinzufügen</h3>
    <ul id="album-liste"></ul>
    <label>Neues Album <input name="neu" autocomplete="off" placeholder="Name"></label>
    <menu>
      <button value="abbrechen" type="button" id="album-abbrechen">Abbrechen</button>
      <button value="ok" type="submit">Hinzufügen</button>
    </menu>
  </form>
</dialog>

<div id="betrachter" hidden>
  <button id="zu" type="button" aria-label="Schliessen">×</button>
  <button id="zurueck" type="button" aria-label="Vorige">‹</button>
  <figure>
    <img id="bild" alt="" hidden>
    <video id="video" controls playsinline hidden></video>
    <figcaption id="angaben"></figcaption>
  </figure>
  <button id="vor" type="button" aria-label="Nächste">›</button>
  <button id="favorit" type="button" aria-label="Favorit">♡</button>
  <a id="laden" download aria-label="Original herunterladen">⤓</a>
</div>

<script src="app.js"></script>
</body>
</html>
