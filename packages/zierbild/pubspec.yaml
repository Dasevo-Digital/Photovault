name: zierbild
description: >-
  Was Rechner- und Handy-App von Photo Vault gleich zeichnen und rechnen:
  den Lebensbaum mit seinen Schriften und das Entwickeln über die Shader.
  Mit Flutter, anders als der Kern.
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  kern:
    path: ../kern
  image: ^4.2.0

dev_dependencies:
  flutter_lints: ^6.0.0
