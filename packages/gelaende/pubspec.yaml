name: gelaende
description: >-
  Die Landschaft unter einer Spur und der Flug darüber – für Rechner- und
  Handy-App von Photo Vault gleich gerechnet und gezeichnet.
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  kern:
    path: ../kern
  flutter_map: ^8.3.1
  http: ^1.6.0
  intl: ^0.20.2

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  generate: true
