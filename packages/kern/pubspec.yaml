name: kern
description: >-
  Datenbank und Dienste von Photo Vault ohne Flutter – derselbe Code für die
  App und für den Server.
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'

# Dieselben Fassungen wie in der App (pubspec.yaml im Wurzelordner). Die App
# löst sie gemeinsam auf; die eigene Auflösung hier dient der Analyse und
# später dem Server, der ohne Flutter gebaut wird.
dependencies:
  crypto: ^3.0.5
  dio: ^5.7.0
  drift: ^2.20.0
  exif: ^3.3.0
  http: ^1.6.0
  image: ^4.2.0
  meta: ^1.15.0
  # Die Dart-API der ONNX Runtime ohne Flutter; die App bringt über das
  # Plugin third_party/flutter_onnxruntime die Umsetzung mit.
  onnxruntime_api:
    path: ../../third_party/onnxruntime_api
  path: ^1.9.0
  sqlite3: ^3.5.1

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.20.0
  lints: ^6.0.0
