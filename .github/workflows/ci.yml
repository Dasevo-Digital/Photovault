# Prüft jeden Stand auf main: Datenschutz, Analyse, Tests und ob die App
# für die einzelnen Plattformen kompiliert. Veröffentlicht wird hier nichts;
# Releases entstehen von Hand aus dem lokalen Release-Ordner.
name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # Die Datenschutzprüfung liest die ganze Historie.
      - name: Datenschutz
        run: tool/pruefe_repository_datenschutz.sh
        env:
          # Echtnamen und eigene Hostnamen, ein Begriff je Zeile. Steht
          # nicht im Repo; fehlt das Secret, prüft das Skript ohne Liste.
          DATENSCHUTZ_SPERRLISTE: ${{ secrets.DATENSCHUTZ_SPERRLISTE }}
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: "3.44.8"
          channel: stable
      - name: Analyse und Tests
        run: flutter pub get && flutter analyze && flutter test

  # Kompiliert die nativen Teile, damit ein kaputter Plattform-Build vor dem
  # Release auffällt. Unter Windows reicht dafür `flutter build windows`:
  # libheif, ffmpeg und die übrigen Werkzeuge aus tool/windows_*.ps1 werden
  # erst beim Verpacken neben das fertige Bündel gelegt und nicht gelinkt.
  # Ob sie im Paket starten, prüft weiter tool/windows_bauen.ps1 -Pruefen.
  native:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-24.04
          - target: linux
            runner: ubuntu-24.04
          - target: apple
            runner: macos-latest
          - target: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: "3.44.8"
          channel: stable
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev
      - if: matrix.target == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      - if: matrix.target == 'android'
        run: flutter build apk --debug
      - if: matrix.target == 'linux'
        run: flutter build linux --debug
      - if: matrix.target == 'windows'
        run: flutter build windows --debug
      - name: macOS und iOS
        if: matrix.target == 'apple'
        run: |
          flutter build macos --debug
          flutter build ios --simulator --debug
