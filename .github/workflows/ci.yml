# Prüft jeden Stand auf main: Datenschutz, Analyse, Tests und ob die App
# für die einzelnen Plattformen kompiliert. Veröffentlicht wird hier nichts;
# Releases entstehen von Hand aus dem lokalen Release-Ordner.
name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Die Datenschutzprüfung liest die ganze Historie.
      - name: Datenschutz
        run: tool/pruefe_repository_datenschutz.sh
        env:
          # Echtnamen und eigene Hostnamen, ein Begriff je Zeile. Steht
          # nicht im Repo; fehlt das Secret, prüft das Skript ohne Liste.
          DATENSCHUTZ_SPERRLISTE: ${{ secrets.DATENSCHUTZ_SPERRLISTE }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.6"
          channel: stable
      # Erst die Pakete: Ohne sie findet dart format die analysis_options
      # (include von flutter_lints) und die Sprachversion nicht und
      # formatiert nach anderen Regeln – dann gilt sauberer Code als falsch.
      # Der Kern (packages/kern) ist ein eigenes Paket ohne Flutter und
      # braucht seine eigene Auflösung, sonst sieht die Analyse dort jeden
      # Import als fehlend. Dasselbe gilt für die Handy-App (apps/mobil).
      - run: flutter pub get && (cd packages/kern && dart pub get) && (cd packages/server && dart pub get) && (cd apps/mobil && flutter pub get)
      - name: Formatierung
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test docs packages apps
      # Die Tests der Handy-App starten einen Server aus packages/server.
      - name: Analyse und Tests
        run: flutter analyze && flutter test && (cd packages/server && dart test) && (cd apps/mobil && flutter test)

  # Kompiliert die nativen Teile, damit ein kaputter Plattform-Build vor dem
  # Release auffällt. Unter Windows reicht dafür `flutter build windows`:
  # libheif, ffmpeg und die übrigen Werkzeuge aus tool/windows_*.ps1 werden
  # erst beim Verpacken neben das fertige Bündel gelegt und nicht gelinkt.
  # Ob sie im Paket starten, prüft weiter tool/windows_bauen.ps1 -Pruefen.
  native:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-24.04
          - target: linux
            runner: ubuntu-24.04
          - target: apple
            runner: macos-latest
          - target: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.6"
          channel: stable
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev
      - if: matrix.target == 'android'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      # Die Protokolle eines Laufs sieht nur, wer bei GitHub angemeldet ist,
      # Anmerkungen dagegen jeder. Scheitert ein Bau, steht das Ende seiner
      # Ausgabe deshalb zusätzlich als Anmerkung am Lauf.
      - name: Bauen
        shell: bash
        run: |
          # Die Handy-App (apps/mobil) baut im Android- und im Apple-Lauf mit.
          case "${{ matrix.target }}" in
            android) befehle=("flutter build apk --debug"
                              "cd apps/mobil && flutter build apk --debug") ;;
            linux)   befehle=("flutter build linux --debug") ;;
            windows) befehle=("flutter build windows --debug") ;;
            apple)   befehle=("flutter build macos --debug"
                              "flutter build ios --simulator --debug"
                              "cd apps/mobil && flutter build ios --simulator --debug") ;;
          esac
          for befehl in "${befehle[@]}"; do
            echo "::group::$befehl"
            set +e
            bash -c "$befehl" 2>&1 | tee bau.log
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              ende=$(tail -n 80 bau.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=$befehl::$ende"
              exit "$status"
            fi
          done

  # Baut das Server-Bild je Plattform auf einem passenden Läufer und prüft,
  # dass es startet und antwortet. Nur gebaut und geprüft, nirgends
  # hochgeladen – das Bild entsteht zum Einsatz von Hand (siehe
  # packages/server/README.md).
  server:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bild bauen
        run: docker build -f packages/server/Dockerfile -t photo-vault-server:pruefung .
      - name: Startet und antwortet
        run: |
          docker run -d --name pv photo-vault-server:pruefung
          for i in $(seq 1 30); do
            if docker exec pv /opt/photo-vault-server/bin/photo_vault_server --lebenszeichen; then
              docker logs pv
              exit 0
            fi
            sleep 1
          done
          docker logs pv
          exit 1
