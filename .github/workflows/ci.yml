# Prüft jeden Stand auf main: Datenschutz, Analyse, Tests und ob die App
# für die einzelnen Plattformen kompiliert. Veröffentlicht wird hier nichts;
# Releases entstehen von Hand aus dem lokalen Release-Ordner.
name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Die Datenschutzprüfung liest die ganze Historie.
      - name: Datenschutz
        run: tool/pruefe_repository_datenschutz.sh
        env:
          # Echtnamen und eigene Hostnamen, ein Begriff je Zeile. Steht
          # nicht im Repo; fehlt das Secret, prüft das Skript ohne Liste.
          DATENSCHUTZ_SPERRLISTE: ${{ secrets.DATENSCHUTZ_SPERRLISTE }}
      - name: Installationsabläufe
        run: python3 -B -m unittest discover -s tool/tests -p 'test_*.py'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: stable
      # Erst die Pakete: Ohne sie findet dart format die analysis_options
      # (include von flutter_lints) und die Sprachversion nicht und
      # formatiert nach anderen Regeln – dann gilt sauberer Code als falsch.
      # Der Kern (packages/kern) ist ein eigenes Paket ohne Flutter und
      # braucht seine eigene Auflösung, sonst sieht die Analyse dort jeden
      # Import als fehlend. Dasselbe gilt für die Handy-App (apps/mobil).
      - run: flutter pub get && (cd packages/kern && dart pub get) && (cd packages/server && dart pub get) && (cd apps/mobil && flutter pub get)
      - name: Formatierung
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test docs packages apps
      # libvips und djxl für die echten Wandlungstests (#274, #276,
      # werkzeuge_echt_test).
      - name: Werkzeuge für Gastprozess-Isolation
        run: sudo apt-get update && sudo apt-get install -y bubblewrap procps libvips-tools libjxl-tools
      # Die Tests der Handy-App starten einen Server aus packages/server.
      # Wie beim Bauen steht das Ende der Ausgabe bei einem Fehlschlag als
      # Anmerkung am Lauf – mit der Liste der roten Tests, die sonst nur im
      # Protokoll stand.
      - name: Analyse und Tests
        shell: bash
        run: |
          befehle=("flutter analyze"
                   "flutter test --reporter expanded"
                   "cd packages/server && dart test --reporter expanded"
                   "cd apps/mobil && flutter test --reporter expanded")
          for befehl in "${befehle[@]}"; do
            echo "::group::$befehl"
            set +e
            bash -c "$befehl" 2>&1 | tee pruefung.log
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              ende=$(tail -n 80 pruefung.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=$befehl::$ende"
              exit "$status"
            fi
          done

  # Kompiliert die nativen Teile, damit ein kaputter Plattform-Build vor dem
  # Release auffällt. Unter Windows reicht dafür `flutter build windows`:
  # libheif, ffmpeg und die übrigen Werkzeuge aus tool/windows_*.ps1 werden
  # erst beim Verpacken neben das fertige Bündel gelegt und nicht gelinkt.
  # Ob sie im Paket starten, prüft weiter tool/windows_bauen.ps1 -Pruefen.
  native:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-24.04
          - target: linux
            runner: ubuntu-24.04
          - target: apple
            runner: macos-latest
          - target: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: stable
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev xvfb xauth
      - if: matrix.target == 'android'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - run: flutter pub get
      # Die Protokolle eines Laufs sieht nur, wer bei GitHub angemeldet ist,
      # Anmerkungen dagegen jeder. Scheitert ein Bau, steht das Ende seiner
      # Ausgabe deshalb zusätzlich als Anmerkung am Lauf.
      - name: Bauen
        shell: bash
        run: |
          # Die Handy-App (apps/mobil) baut im Android- und im Apple-Lauf mit.
          case "${{ matrix.target }}" in
            android) befehle=("flutter build apk --debug"
                              "cd apps/mobil && flutter build apk --debug") ;;
            linux)   befehle=("flutter build linux --debug") ;;
            windows) befehle=("flutter build windows --debug") ;;
            apple)   befehle=("flutter build macos --debug"
                              "flutter build ios --simulator --debug"
                              "cd apps/mobil && flutter build ios --simulator --debug") ;;
          esac
          for befehl in "${befehle[@]}"; do
            echo "::group::$befehl"
            set +e
            bash -c "$befehl" 2>&1 | tee bau.log
            status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              ende=$(tail -n 80 bau.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
              echo "::error title=$befehl::$ende"
              exit "$status"
            fi
          done
      - name: Kurze Desktop-Regressionen
        if: matrix.target == 'apple' || matrix.target == 'windows'
        timeout-minutes: 12
        shell: bash
        run: bash tool/desktop_regressionen.sh
      # Kleine Katalogläufe ohne Server oder Medien aus einer Bibliothek.
      # Die vollständigen Läufe brauchen die getrennte Katalogumgebung.
      - name: Desktop-Katalog (Start, Import und Zeitleiste)
        if: matrix.target == 'linux'
        timeout-minutes: 12
        run: xvfb-run -a -s '-screen 0 1600x1000x24' flutter test -d linux integration_test/katalog_grundgeruest_test.dart --reporter expanded
      - name: RAW16 nativ
        if: matrix.target == 'apple'
        timeout-minutes: 3
        run: python3 tool/raw16_nativ_probe.py
      - name: Handy-Katalog (Start und Anmeldung)
        if: matrix.target == 'apple'
        timeout-minutes: 18
        working-directory: apps/mobil
        shell: bash
        run: |
          simulator=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          geraete = json.load(sys.stdin)["devices"]
          runtimes = sorted(
              (r for r in geraete if r.startswith("com.apple.CoreSimulator.SimRuntime.iOS-")),
              key=lambda r: tuple(map(int, r.partition("iOS-")[2].split("-"))),
              reverse=True,
          )
          print(next(g["udid"] for r in runtimes for g in geraete[r] if g["name"].startswith("iPhone")))
          ')
          # Die Katalogprüfungen lesen die deutschen Texte, wie am lokalen
          # Prüfsimulator; die Simulatoren der Runner stehen auf Englisch, und
          # MOB-001 fand „Mit Server verbinden“ deshalb nie. Sprache setzen,
          # dann neu starten, damit jede gestartete App sie übernimmt.
          xcrun simctl bootstatus "$simulator" -b
          xcrun simctl spawn "$simulator" defaults write -g AppleLanguages -array de-DE
          xcrun simctl spawn "$simulator" defaults write -g AppleLocale -string de_DE
          xcrun simctl shutdown "$simulator"
          xcrun simctl bootstatus "$simulator" -b
          set +e
          flutter test -d "$simulator" integration_test/katalog_mob_kurz_test.dart --reporter expanded 2>&1 | tee handy.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            ende=$(tail -n 100 handy.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Handy-Katalog::$ende"
            exit "$status"
          fi
      # Nach dem Bauen: Scheitern die Installationsabläufe, ist der Bau
      # trotzdem geprüft – vorher übersprang ein roter Test ihn wochenlang
      # (#257). Ihre Ausgabe steht wie beim Bauen als Anmerkung am Lauf.
      - name: Installationsabläufe unter Windows
        if: matrix.target == 'windows'
        shell: bash
        run: |
          set +e
          python -B -m unittest discover -s tool/tests -p 'test_*.py' 2>&1 | tee installation.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            ende=$(tail -n 80 installation.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Installationsabläufe unter Windows::$ende"
            exit "$status"
          fi

  # Baut das Server-Bild je Plattform auf einem passenden Läufer und prüft,
  # dass es startet und antwortet. Nur gebaut und geprüft, nirgends
  # hochgeladen – das Bild entsteht zum Einsatz von Hand (siehe
  # packages/server/README.md).
  server:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bild bauen
        shell: bash
        run: |
          set +e
          docker build -f packages/server/Dockerfile -t photo-vault-server:pruefung . --progress=plain 2>&1 | tee server-bau.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            ende=$(tail -n 100 server-bau.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Serverbau::$ende"
            exit "$status"
          fi
      - name: Startet und antwortet
        run: |
          docker run -d --name pv photo-vault-server:pruefung
          for i in $(seq 1 30); do
            if docker exec pv /opt/photo-vault-server/bin/photo_vault_server --lebenszeichen; then
              docker logs pv
              exit 0
            fi
            sleep 1
          done
          docker logs pv
          exit 1
      # Das Bild für Intel-Grafik (OpenVINO) gibt es nur für amd64. Ohne
      # Grafik auf dem Läufer rechnet es auf der CPU; geprüft wird, dass es
      # baut, startet und antwortet.
      - name: Bild mit OpenVINO bauen
        if: matrix.runner == 'ubuntu-24.04'
        shell: bash
        run: |
          set +e
          docker build -f packages/server/Dockerfile --target openvino -t photo-vault-server:openvino . --progress=plain 2>&1 | tee server-bau.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            ende=$(tail -n 100 server-bau.log | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Serverbau::$ende"
            exit "$status"
          fi
      - name: Bild mit OpenVINO startet und antwortet
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          docker run -d --name pv-openvino photo-vault-server:openvino
          for i in $(seq 1 30); do
            if docker exec pv-openvino /opt/photo-vault-server/bin/photo_vault_server --lebenszeichen; then
              docker logs pv-openvino
              exit 0
            fi
            sleep 1
          done
          docker logs pv-openvino
          exit 1
